version: "3.8"

services:
  # 数据库服务
  neo4j:
    image: neo4j:5.22
    container_name: smart-paper-neo4j
    ports:
      - "7474:7474"   # Browser UI
      - "7687:7687"   # Bolt
    environment:
      - NEO4J_AUTH=neo4j/smart_paper_secure_password_2024
      - NEO4J_PLUGINS=[]
      - NEO4J_dbms_memory_heap_initial__size=512m
      - NEO4J_dbms_memory_heap_max__size=2G
      - NEO4J_dbms_memory_pagecache_size=1G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - smart-paper-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "smart_paper_secure_password_2024", "RETURN 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  qdrant:
    image: qdrant/qdrant:v1.11.0
    container_name: smart-paper-qdrant
    ports:
      - "6333:6333"   # HTTP API
      - "6334:6334"   # gRPC API
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - smart-paper-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 后端API服务
  backend:
    build:
      context: ./agent-crawler
      dockerfile: Dockerfile
    container_name: smart-paper-backend
    ports:
      - "8080:8080"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=smart_paper_secure_password_2024
      - QDRANT_URL=http://qdrant:6333
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=llama-3.1-70b-versatile
      - ENABLE_CONCURRENT_PROCESSING=false
      - MAX_CONCURRENT_WORKERS=3
    volumes:
      - ./agent-crawler/.env:/app/.env:ro
    networks:
      - smart-paper-network
    depends_on:
      neo4j:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 前端界面
  frontend:
    build:
      context: ./genesis-frontend
      dockerfile: Dockerfile
    container_name: smart-paper-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:8080
    networks:
      - smart-paper-network
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 每日调度器 (可选)
  scheduler:
    build:
      context: ./agent-crawler
      dockerfile: Dockerfile
    container_name: smart-paper-scheduler
    command: python daily_scheduler.py daemon
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=smart_paper_secure_password_2024
      - QDRANT_URL=http://qdrant:6333
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=llama-3.1-70b-versatile
      - DAILY_PAPER_COUNT=10
      - DAILY_SMART_MODE=true
      - DAILY_SCHEDULE_TIME=10:00
    volumes:
      - ./agent-crawler/.env:/app/.env:ro
    networks:
      - smart-paper-network
    depends_on:
      neo4j:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    restart: unless-stopped
    profiles:
      - scheduler  # 使用 --profile scheduler 启用

networks:
  smart-paper-network:
    driver: bridge

volumes:
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local
  qdrant_data:
    driver: local
