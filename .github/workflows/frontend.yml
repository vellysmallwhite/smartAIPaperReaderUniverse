name: Frontend - Netlify Deploy (Paused)

on:
  # 暂停前端自动部署，仅保留手动触发
  workflow_dispatch: {}

jobs:
  build-and-deploy:
    # 暂停执行
    if: ${{ false }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/genesis-frontend
    steps:
      - name: Validate required secrets
        run: |
          test -n "${{ secrets.NETLIFY_AUTH_TOKEN }}" || (echo "NETLIFY_AUTH_TOKEN is empty" && exit 1)
          test -n "${{ secrets.NETLIFY_SITE_ID }}" || (echo "NETLIFY_SITE_ID is empty" && exit 1)
          test -n "${{ secrets.NEXT_PUBLIC_API_URL }}" || (echo "NEXT_PUBLIC_API_URL is empty" && exit 1)

      - uses: actions/checkout@v4

      - name: Use Node 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install deps
        run: npm ci

      - name: Build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NODE_ENV: production
        run: npm run build

      - name: Deploy to Netlify
        uses: netlify/actions/cli@v4.4.1
        with:
          args: deploy --dir=.next --prod
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

