name: Backend - Docker SSH Deploy

on:
  push:
    branches: [ production ]
    tags: ['v*']
    paths:
      - 'services/**'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Rsync services to server
        run: |
          rsync -az --delete \
            -e "ssh -o StrictHostKeyChecking=no" \
            services/ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:~/smartAIPaperReaderUniverse/services/

      - name: Remote deploy with docker compose
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
          cd ~/smartAIPaperReaderUniverse/services
          # 写入生产环境 .env（仅用于容器内部读取）
          cat > ./agent-crawler/.env <<EOT
GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
NEO4J_URI=bolt://neo4j:7687
NEO4J_USER=neo4j
NEO4J_PASSWORD=${{ secrets.NEO4J_PASSWORD }}
QDRANT_URL=http://qdrant:6333
DAILY_PAPER_COUNT=${{ secrets.DAILY_PAPER_COUNT || 10 }}
DAILY_SMART_MODE=${{ secrets.DAILY_SMART_MODE || 'true' }}
DAILY_SCHEDULE_TIME=${{ secrets.DAILY_SCHEDULE_TIME || '10:00' }}
EOT

          docker compose -f docker-compose.prod.yml up -d --build neo4j qdrant backend scheduler
          EOF

