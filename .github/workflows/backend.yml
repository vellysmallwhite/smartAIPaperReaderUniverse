name: Backend - Docker SSH Deploy

on:
  push:
    branches: [ production ]
    tags: ['v*']
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate required secrets
        run: |
          test -n "${{ secrets.SSH_HOST }}" || (echo "SSH_HOST is empty" && exit 1)
          test -n "${{ secrets.SSH_USER }}" || (echo "SSH_USER is empty" && exit 1)
          test -n "${{ secrets.SSH_KEY }}"  || (echo "SSH_KEY is empty" && exit 1)
          test -n "${{ secrets.GROQ_API_KEY }}" || (echo "GROQ_API_KEY is empty" && exit 1)
          test -n "${{ secrets.NEO4J_PASSWORD }}" || (echo "NEO4J_PASSWORD is empty" && exit 1)

      - name: Write SSH key to file
        run: |
          echo "${{ secrets.SSH_KEY }}" > id_deploy
          chmod 600 id_deploy

      - name: Deploy via git clone on remote server
        run: |
          ssh -i id_deploy -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
          
          echo "=== Starting deployment ==="
          echo "Current user: $(whoami)"
          echo "Home directory: $HOME"
          echo "Current working directory: $(pwd)"
          
          # 检查基础工具
          which git || echo "Git not found!"
          which docker || echo "Docker not found!"
          which docker-compose || echo "Docker Compose not found!"
          
          # 清理旧的部署目录
          echo "=== Cleaning old deployment ==="
          rm -rf ~/smartAIPaperReaderUniverse
          
          # 克隆最新代码
          echo "=== Cloning repository ==="
          git clone https://github.com/vellysmallwhite/smartAIPaperReaderUniverse.git
          
          if [ ! -d ~/smartAIPaperReaderUniverse ]; then
            echo "ERROR: Git clone failed!"
            exit 1
          fi
          
          echo "=== Repository cloned successfully ==="
          ls -la ~/smartAIPaperReaderUniverse/
          
          cd ~/smartAIPaperReaderUniverse/services
          echo "=== Changed to services directory ==="
          pwd
          ls -la
          
          # 写入生产环境 .env
          cat > ./agent-crawler/.env << EOT
          GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
          NEO4J_URI=bolt://neo4j:7687
          NEO4J_USER=neo4j
          NEO4J_PASSWORD=${{ secrets.NEO4J_PASSWORD }}
          QDRANT_URL=http://qdrant:6333
          DAILY_PAPER_COUNT=${{ secrets.DAILY_PAPER_COUNT }}
          DAILY_SMART_MODE=${{ secrets.DAILY_SMART_MODE }}
          DAILY_SCHEDULE_TIME=${{ secrets.DAILY_SCHEDULE_TIME }}
          EOT
          
          # 部署容器
          docker compose -f docker-compose.prod.yml up -d --build neo4j qdrant backend scheduler
          
          EOF

