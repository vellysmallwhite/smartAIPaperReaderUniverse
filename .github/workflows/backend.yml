name: Backend - Docker SSH Deploy

on:
  push:
    branches: [ production ]
    tags: ['v*']
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate required secrets
        run: |
          test -n "${{ secrets.SSH_HOST }}" || (echo "SSH_HOST is empty" && exit 1)
          test -n "${{ secrets.SSH_USER }}" || (echo "SSH_USER is empty" && exit 1)
          test -n "${{ secrets.SSH_KEY }}"  || (echo "SSH_KEY is empty" && exit 1)
          test -n "${{ secrets.GROQ_API_KEY }}" || (echo "GROQ_API_KEY is empty" && exit 1)
          test -n "${{ secrets.NEO4J_PASSWORD }}" || (echo "NEO4J_PASSWORD is empty" && exit 1)

      - name: Write SSH key to file
        run: |
          echo "${{ secrets.SSH_KEY }}" > id_deploy
          chmod 600 id_deploy

      - name: Check remote server basics
        run: |
          ssh -i id_deploy -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            'echo "=== Server Info ==="; whoami; pwd; which git; which docker; ls -la ~/'

      - name: Clean and clone repository
        run: |
          ssh -i id_deploy -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            'rm -rf ~/smartAIPaperReaderUniverse && git clone https://github.com/vellysmallwhite/smartAIPaperReaderUniverse.git && ls -la ~/smartAIPaperReaderUniverse/'

      - name: Create .env file
        run: |
          ssh -i id_deploy -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "cd ~/smartAIPaperReaderUniverse/services && cat > ./agent-crawler/.env << 'EOT'
          GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
          NEO4J_URI=bolt://neo4j:7687
          NEO4J_USER=neo4j
          NEO4J_PASSWORD=${{ secrets.NEO4J_PASSWORD }}
          QDRANT_URL=http://qdrant:6333
          DAILY_PAPER_COUNT=${{ secrets.DAILY_PAPER_COUNT }}
          DAILY_SMART_MODE=${{ secrets.DAILY_SMART_MODE }}
          DAILY_SCHEDULE_TIME=${{ secrets.DAILY_SCHEDULE_TIME }}
          EOT"

      - name: Deploy with Docker Compose
        run: |
          ssh -i id_deploy -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            'cd ~/smartAIPaperReaderUniverse/services && docker compose -f docker-compose.prod.yml up -d --build neo4j qdrant backend scheduler'

