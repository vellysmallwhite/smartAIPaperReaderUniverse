name: smart-paper-backend
region: sgp1
services:
  - name: backend
    github:
      repo: vellysmallwhite/smartAIPaperReaderUniverse
      branch: production
      deploy_on_push: true
    source_dir: services/agent-crawler
    dockerfile_path: Dockerfile
    http_port: 8080
    routes:
      - path: /
    envs:
      - key: GROQ_API_KEY
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      - key: NEO4J_URI
        scope: RUN_TIME
        type: SECRET
      - key: NEO4J_USER
        scope: RUN_TIME
        value: neo4j
      - key: NEO4J_PASSWORD
        scope: RUN_TIME
        type: SECRET
      - key: QDRANT_URL
        scope: RUN_TIME
        type: SECRET
      - key: ENABLE_CONCURRENT_PROCESSING
        scope: RUN_TIME
        value: "false"
      - key: GROQ_MODEL
        scope: RUN_TIME
        value: llama-3.1-70b-versatile