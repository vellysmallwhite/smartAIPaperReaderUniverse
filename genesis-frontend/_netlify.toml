[build]
  base = "."
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "18"
  NPM_VERSION = "9"

# SPA fallback for client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# API proxy rules (fallback if needed) - 使用环境变量
# 在Netlify中配置 NEXT_PUBLIC_API_BASE_URL 环境变量
